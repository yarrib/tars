pipelines:
  - name: contract_pipeline
    description: "Extracts key terms from legal contracts."
    parser:
      name: parser.databricks_ai
      config:
        endpoint: databricks-claude-sonnet-5
        fields:
          - name: parties
            type: array
            description: "Names of the contracting parties"
          - name: effective_date
            type: string
            description: "ISO 8601 date"
          - name: term_length
            type: string
            required: false
          - name: governing_law
            type: string
            required: false
    sinks:
      - name: sink.delta
        config:
          table: main.docs.contracts
          batch_size: 50
    on_error: dead_letter
    dead_letter_sink:
      name: sink.volume
      config:
        path: /Volumes/main/docs/dead_letter/contracts
        write_content: true

  - name: unclassified_pipeline
    description: "Catch-all for documents neither classifier could label."
    parser:
      name: parser.text
    sinks:
      - name: sink.volume
        config:
          path: /Volumes/main/docs/unclassified
          write_content: true
