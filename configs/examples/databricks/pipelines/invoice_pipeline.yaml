pipelines:
  - name: invoice_pipeline
    description: "Extracts header fields and line items from vendor invoices."
    parser:
      name: parser.databricks_ai
      config:
        endpoint: databricks-claude-sonnet-5
        fields:
          - name: vendor_name
            type: string
            description: "Company issuing the invoice"
          - name: invoice_number
            type: string
          - name: invoice_date
            type: string
            description: "ISO 8601 date"
          - name: total_amount
            type: number
          - name: line_items
            type: array
            description: "Line items, each with description/quantity/unit_price"
            required: false
    sinks:
      - name: sink.delta
        config:
          table: main.docs.invoices
          batch_size: 50
    on_error: dead_letter
    dead_letter_sink:
      name: sink.volume
      config:
        path: /Volumes/main/docs/dead_letter/invoices
        write_content: true
