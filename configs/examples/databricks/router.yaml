router:
  # Auto Loader watches a Unity Catalog Volume landing zone and picks up
  # new files exactly once, tracking progress via its own checkpoint --
  # no polling, no state file needed (unlike source.volume_listener).
  source:
    name: source.autoloader
    config:
      path: /Volumes/main/landing/raw_docs
      file_format: binaryFile
      schema_location: /Volumes/main/landing/_schema/raw_docs
      include_content: true
      max_files_per_trigger: 500

  # Cheap deterministic rules run first; anything they can't confidently
  # label falls through to Databricks' built-in `ai_classify()` SQL
  # function, which runs on a Databricks-governed model -- no external
  # API key, inherits Unity Catalog governance/audit logging.
  classifiers:
    - name: classifier.rule_based
      config:
        rules:
          - doc_type: invoice
            extensions: [pdf]
            filename_regex: "(?i)invoice"
          - doc_type: contract
            extensions: [pdf, docx]
            filename_regex: "(?i)(contract|agreement|msa)"
    - name: classifier.databricks_ai
      config:
        doc_types: [invoice, contract]

  routes:
    - doc_type: invoice
      pipeline: invoice_pipeline
    - doc_type: contract
      pipeline: contract_pipeline

  default_pipeline: unclassified_pipeline
