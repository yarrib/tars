# Production-shaped example: Auto Loader ingestion, classification and
# field extraction via Databricks' built-in AI Functions (ai_classify,
# ai_parse_document, ai_query), Delta Lake sinks. Deploy via the Databricks
# Asset Bundle in `databricks_bundle/`, which passes this directory as the
# job's `--config` argument.
#
# Requires: pip install 'tars[databricks]' and a Databricks runtime with
# AI Functions / Mosaic AI Model Serving enabled. No external API key
# needed -- ai_classify/ai_parse_document/ai_query run on Databricks-hosted,
# Unity-Catalog-governed model endpoints.
version: 1
plugins: []
