# One shared source feeds the router; the router classifies each document
# with a chain of rule-based checks, then dispatches to the matching
# pipeline's classify/parse/sink chain (see pipelines/*.yaml).
router:
  source:
    name: source.volume_listener
    config:
      path: ${TARS_LANDING_DIR:-./data/landing}
      include_content: true
      state_path: ${TARS_LANDING_DIR:-./data/landing}/.tars_checkpoint.json

  classifiers:
    - name: classifier.rule_based
      config:
        rules:
          - doc_type: invoice
            filename_regex: "(?i)invoice"
          - doc_type: contract
            filename_regex: "(?i)(contract|agreement)"

  routes:
    - doc_type: invoice
      pipeline: invoice_pipeline
    - doc_type: contract
      pipeline: contract_pipeline

  default_pipeline: unclassified_pipeline
