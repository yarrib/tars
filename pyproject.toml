[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tars"
version = "0.1.0"
description = "Adaptable, config-driven document ingestion, routing, and AI parsing for Databricks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tars contributors" }]
keywords = ["databricks", "ingestion", "document-ai", "etl", "pipeline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.4",
  "PyYAML>=6.0",
  "click>=8.1",
  "jinja2>=3.1",
]

[project.optional-dependencies]
databricks = ["databricks-sdk>=0.20", "pyspark>=3.5"]
ai = ["anthropic>=0.34"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
all = ["tars[databricks,ai,api]"]

[project.scripts]
tars = "tars.cli.main:cli"
tars-databricks-job = "tars.databricks.entrypoint:main"

[project.entry-points."tars.plugins"]
"source.autoloader" = "tars.plugins.sources.autoloader:AutoloaderSource"
"source.volume_listener" = "tars.plugins.sources.volume_listener:VolumeListenerSource"
"source.api" = "tars.plugins.sources.api_source:ApiSource"
"classifier.rule_based" = "tars.plugins.classifiers.rule_based:RuleBasedClassifier"
"classifier.ai" = "tars.plugins.classifiers.ai_classifier:AiClassifier"
"classifier.databricks_ai" = "tars.plugins.classifiers.databricks_ai:DatabricksAiClassifier"
"parser.ai" = "tars.plugins.parsers.ai_parser:AiParser"
"parser.databricks_ai" = "tars.plugins.parsers.databricks_ai_parser:DatabricksAiParser"
"parser.text" = "tars.plugins.parsers.text_parser:TextParser"
"sink.delta" = "tars.plugins.sinks.delta_sink:DeltaSink"
"sink.volume" = "tars.plugins.sinks.volume_sink:VolumeSink"

[tool.hatch.build.targets.wheel]
packages = ["src/tars"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
