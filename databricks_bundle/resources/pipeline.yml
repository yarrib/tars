# The Lakeflow Declarative Pipeline generated by `tars generate-dlt` from
# ${var.config_path}. Serverless -- no cluster spec here or anywhere else
# in this bundle; Databricks manages compute for the pipeline directly.
#
# Every pipeline in your tars config that's reachable through
# router.routes/default_pipeline (and doesn't set deploy.dedicated: true)
# is compiled into *this one* pipeline as an additional table. Add a route
# in YAML, redeploy -- no new resource block needed here.
resources:
  pipelines:
    tars_pipeline:
      name: "tars-pipeline-${bundle.target}"
      catalog: "${var.catalog}"
      schema: "${var.schema}"
      serverless: true
      photon: true
      continuous: false
      libraries:
        - file:
            path: ../generated/tars_pipeline.py
      configuration:
        tars.config_path: "${var.config_path}"

      # Uncomment if your config uses classifier.ai/parser.ai (see the
      # `artifacts` note in databricks.yml -- same condition applies here):
      # environment:
      #   dependencies:
      #     - ../../dist/*.whl

# If a pipeline in your config sets `deploy: {dedicated: true}`,
# `tars generate-dlt` emits it as generated/pipeline_<name>.py instead of
# folding it into tars_pipeline.py above. Give it its own resource block
# here (copy the block above, point `libraries` at that file, and adjust
# `name`) -- that's the "unless desired" opt-in the routing model allows.
