# Thin, serverless trigger wrapper: fires the shared Lakeflow Declarative
# Pipeline (resources/pipeline.yml) when new files land in the Unity
# Catalog Volume it watches. A `pipeline_task` needs no cluster spec of
# its own -- the pipeline resource carries its own (serverless) compute --
# so this job has no job_clusters/new_cluster anywhere.
resources:
  jobs:
    tars_ingestion_job:
      name: "tars-ingestion-${bundle.target}"

      trigger:
        file_arrival:
          url: "${var.landing_volume_path}"
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 30

      tasks:
        - task_key: run_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.tars_pipeline.id}

      email_notifications:
        on_failure:
          - "your-team@example.com"
