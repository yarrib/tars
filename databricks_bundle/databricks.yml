# Databricks Asset Bundle for tars.
#
# Everything here is serverless -- no cluster spec anywhere in this bundle.
# The Lakeflow Declarative Pipeline resource (resources/pipeline.yml) does
# the actual ingest/classify/parse/write work; the Job (resources/job.yml)
# just triggers it on file arrival. Adding a pipeline in tars YAML config
# adds a table to that one generated pipeline -- it does not create a new
# Job or Pipeline resource here, unless that pipeline sets
# `deploy: {dedicated: true}` in its config.
#
# Deploy:
#   tars generate-dlt -c ../configs/examples/databricks -o generated   # regenerate first
#   databricks bundle deploy -t dev
#   databricks bundle run -t dev tars_ingestion_job
#
# See https://docs.databricks.com/dev-tools/bundles/ for the full DAB spec.
bundle:
  name: tars

variables:
  config_path:
    description: "Path (inside the deployed bundle) to the tars config directory."
    default: configs/examples/databricks
  catalog:
    description: "Unity Catalog catalog the generated pipeline writes into."
    default: main
  schema:
    description: "Unity Catalog schema (target) the generated pipeline writes into."
    default: docs
  landing_volume_path:
    description: "Unity Catalog Volume path the file-arrival trigger watches."
    default: /Volumes/main/landing/raw_docs

# Only needed if your config uses classifier.ai/parser.ai (direct Anthropic
# calls, compiled to a pandas UDF that imports the `tars` package at
# runtime). The native classifier.databricks_ai/parser.databricks_ai path
# needs no extra dependency -- generated code for that path only imports
# `dp` (pyspark.pipelines) and `pyspark.sql.functions`. Uncomment if you need it:
#
# artifacts:
#   tars_wheel:
#     type: whl
#     build: python -m build --wheel
#     path: ../

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace-instance>.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://<your-workspace-instance>.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: <your-service-principal-application-id>
